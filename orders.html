<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Đơn hàng của tôi - HuyMobilePhone</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- CSS của website -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<!-- ==================================================
     NAVBAR
================================================== -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">


        <!-- LOGO -->

        <a
            class="navbar-brand"
            href="index.html"
        >

            <img
                src="images/logo.png"
                alt="HuyMobilePhone"
                class="logo"
            >

        </a>


        <!-- MENU MOBILE -->

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainMenu"
            aria-controls="mainMenu"
            aria-expanded="false"
            aria-label="Mở menu"
        >

            <span class="navbar-toggler-icon"></span>

        </button>


        <!-- MENU -->

        <div
            class="collapse navbar-collapse"
            id="mainMenu"
        >

            <ul class="navbar-nav ms-auto">


                <!-- TRANG CHỦ -->

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="index.html"
                    >

                        <i class="bi bi-house"></i>

                        Trang chủ

                    </a>

                </li>


                <!-- ĐƠN HÀNG -->

                <li class="nav-item">

                    <a
                        class="nav-link active"
                        href="orders.html"
                    >

                        <i class="bi bi-receipt"></i>

                        Đơn hàng

                    </a>

                </li>


            </ul>

        </div>

    </div>

</nav>



<!-- ==================================================
     NỘI DUNG
================================================== -->

<section class="py-5">

    <div class="container">


        <!-- TIÊU ĐỀ -->

        <div class="mb-4">

            <span class="text-primary fw-bold">

                HuyMobilePhone

            </span>

            <h2 class="mt-2">

                Đơn hàng của tôi

            </h2>

            <p class="text-secondary">

                Xem lại các đơn hàng bạn đã đặt.

            </p>

        </div>



        <!-- ==================================================
             THÔNG BÁO
        ================================================== -->

        <div
            id="message"
            class="mb-3"
        ></div>



        <!-- ==================================================
             DANH SÁCH ĐƠN HÀNG
        ================================================== -->

        <div id="ordersList">

            <!-- Loading -->

            <div class="text-center py-5">

                <div
                    class="spinner-border text-primary"
                    role="status"
                >

                    <span class="visually-hidden">
                        Đang tải...
                    </span>

                </div>

                <p class="mt-3">

                    Đang tải đơn hàng...

                </p>

            </div>

        </div>


    </div>

</section>



<!-- ==================================================
     MODAL CHI TIẾT ĐƠN HÀNG
================================================== -->

<div
    class="modal fade"
    id="orderDetailModal"
    tabindex="-1"
    aria-labelledby="orderDetailModalLabel"
    aria-hidden="true"
>

    <div class="modal-dialog modal-lg">

        <div class="modal-content">


            <!-- HEADER -->

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="orderDetailModalLabel"
                >

                    <i class="bi bi-receipt"></i>

                    Chi tiết đơn hàng

                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Đóng"
                ></button>

            </div>



            <!-- BODY -->

            <div
                class="modal-body"
                id="orderDetail"
            >

                <!-- orders.js sẽ đưa nội dung vào đây -->

                <div class="text-center py-4">

                    <div
                        class="spinner-border text-primary"
                        role="status"
                    >

                        <span class="visually-hidden">
                            Đang tải...
                        </span>

                    </div>

                </div>

            </div>


        </div>

    </div>

</div>



<!-- ==================================================
     BOOTSTRAP JS
================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>



<!-- ==================================================
     ORDERS.JS
================================================== -->

<script src="js/orders.js"></script>


</body>

</html>
```
