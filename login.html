<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Đăng nhập - HuyMobilePhone</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="login-page">


    <!-- ==============================
         NÚT VỀ TRANG CHỦ
    =============================== -->

    <a
        href="index.html"
        class="back-home"
    >

        <i class="bi bi-arrow-left"></i>

        Về trang chủ

    </a>



    <!-- ==============================
         KHUNG ĐĂNG NHẬP
    =============================== -->

    <main class="login-container">


        <div class="login-card">


            <!-- LOGO -->

            <div class="login-logo">

                <img
                    src="images/logo.png"
                    alt="HuyMobilePhone"
                >

            </div>



            <!-- TIÊU ĐỀ -->

            <div class="text-center mb-4">

                <h2>
                    Chào mừng trở lại!
                </h2>

                <p>
                    Đăng nhập vào HuyMobilePhone
                </p>

            </div>



            <!-- FORM -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="mb-3">

                    <label
                        for="email"
                        class="form-label"
                    >

                        Email

                    </label>


                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-envelope"></i>

                        </span>


                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            placeholder="Nhập email của bạn"
                            required
                        >

                    </div>

                </div>



                <!-- MẬT KHẨU -->

                <div class="mb-2">

                    <label
                        for="password"
                        class="form-label"
                    >

                        Mật khẩu

                    </label>


                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-lock"></i>

                        </span>


                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Nhập mật khẩu"
                            required
                        >


                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            id="showPassword"
                        >

                            <i
                                class="bi bi-eye"
                                id="passwordIcon"
                            ></i>

                        </button>

                    </div>

                </div>



                <!-- QUÊN MẬT KHẨU -->

                <div class="text-end mb-4">

                    <a
                        href="#"
                        id="forgotPassword"
                    >

                        Quên mật khẩu?

                    </a>

                </div>



                <!-- THÔNG BÁO -->

                <div
                    id="loginMessage"
                    class="mb-3"
                ></div>



                <!-- ĐĂNG NHẬP -->

                <button
                    type="submit"
                    class="
                        btn
                        btn-primary
                        w-100
                        login-button
                    "
                >

                    <i class="bi bi-box-arrow-in-right"></i>

                    Đăng nhập

                </button>


            </form>



            <!-- ĐĂNG KÝ -->

            <div class="register-text">

                Chưa có tài khoản?

                <a
                    href="#"
                    id="registerLink"
                >

                    Đăng ký ngay

                </a>

            </div>



            <!-- TÀI KHOẢN DEMO -->

            <div class="demo-account">

                <div class="demo-title">

                    <i class="bi bi-info-circle"></i>

                    Tài khoản Demo

                </div>


                <div>

                    Email:

                    <strong>
                        admin@gmail.com
                    </strong>

                </div>


                <div>

                    Mật khẩu:

                    <strong>
                        123456
                    </strong>

                </div>

            </div>


        </div>


    </main>



    <!-- ==============================
         JAVASCRIPT
    =============================== -->

    <script src="js/login.js"></script>


</body>

</html>
