<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng ký - HuyMobilePhone</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS của website -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <div class="row justify-content-center mt-5">

            <div class="col-md-6 col-lg-5">

                <div class="card shadow">

                    <div class="card-body p-4">

                        <h2 class="text-center mb-4">
                            Tạo tài khoản
                        </h2>

                        <form id="registerForm">

                            <!-- Họ tên -->
                            <div class="mb-3">
                                <label class="form-label">
                                    Họ và tên
                                </label>

                                <input
                                    type="text"
                                    id="name"
                                    class="form-control"
                                    placeholder="Nhập họ và tên"
                                    required
                                >
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    placeholder="Nhập email"
                                    required
                                >
                            </div>

                            <!-- Mật khẩu -->
                            <div class="mb-3">
                                <label class="form-label">
                                    Mật khẩu
                                </label>

                                <input
                                    type="password"
                                    id="password"
                                    class="form-control"
                                    placeholder="Nhập mật khẩu"
                                    required
                                >
                            </div>

                            <!-- Nhập lại mật khẩu -->
                            <div class="mb-3">
                                <label class="form-label">
                                    Nhập lại mật khẩu
                                </label>

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    class="form-control"
                                    placeholder="Nhập lại mật khẩu"
                                    required
                                >
                            </div>

                            <!-- Thông báo -->
                            <div
                                id="message"
                                class="mb-3 text-center"
                            ></div>

                            <!-- Nút đăng ký -->
                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Đăng ký
                            </button>

                        </form>

                        <div class="text-center mt-3">

                            Đã có tài khoản?

                            <a href="login.html">
                                Đăng nhập
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="js/register.js"></script>

</body>

</html>
